version: '3'
services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim-mato-grosso
    ports:
      - "8080:8080"
    environment:
      # Usando Brasil inteiro - Mato Grosso está incluído
      PBF_URL: https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/south-america/brazil-updates/
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: nominatim
      # Configurações para área específica (Mato Grosso)
      # Coordenadas aproximadas: Sul -18.04, Norte -7.35, Oeste -61.63, Leste -50.22
      IMPORT_STYLE: admin
      NOMINATIM_FLATNODE_FILE: ""
    volumes:
      - nominatim-data-mt:/var/lib/postgresql/14/main
    shm_size: 2gb
    restart: unless-stopped

volumes:
  nominatim-data-mt:
